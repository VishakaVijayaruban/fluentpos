<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a7f5a">
  <title>FluentPOS Till</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #f2f4f3; color: #1c2321; }
    button { cursor: pointer; border: 0; border-radius: 6px; font-size: 15px; }
    .hidden { display: none !important; }

    /* status bar */
    #statusbar { display: flex; gap: 12px; align-items: center; padding: 8px 14px; background: #1c2321; color: #fff; font-size: 13px; }
    #statusbar .dot { width: 10px; height: 10px; border-radius: 50%; background: #37b26c; }
    #statusbar.offline .dot { background: #d64545; }
    #queueBadge { background: #e0a437; color: #1c2321; border-radius: 10px; padding: 1px 8px; font-weight: 600; }
    #statusbar .spacer { flex: 1; }
    #statusbar button { background: #3a4644; color: #fff; padding: 4px 10px; }

    /* login */
    #login { max-width: 340px; margin: 10vh auto; background: #fff; padding: 28px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    #login h1 { font-size: 20px; margin-bottom: 16px; }
    #login input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cdd6d3; border-radius: 6px; font-size: 15px; }
    #login button { width: 100%; padding: 11px; background: #1a7f5a; color: #fff; font-weight: 600; }
    #loginError { color: #d64545; font-size: 13px; margin-bottom: 8px; min-height: 16px; }

    /* pos layout */
    #pos { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px; height: calc(100vh - 37px); }
    #products { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-content: start; }
    .tile { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.07); text-align: left; position: relative; }
    .tile:active { transform: scale(.98); }
    .tile .name { font-size: 14px; font-weight: 600; margin-bottom: 6px; min-height: 34px; }
    .tile .price { color: #1a7f5a; font-weight: 700; }
    .tile .age { position: absolute; top: 6px; right: 6px; background: #d64545; color: #fff; border-radius: 4px; font-size: 11px; padding: 1px 5px; font-weight: 700; }

    /* cart */
    #cartPanel { background: #fff; border-radius: 10px; display: flex; flex-direction: column; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
    #cartPanel h2 { font-size: 16px; padding: 12px 14px 6px; }
    #cartItems { flex: 1; overflow-y: auto; padding: 0 14px; }
    .cartRow { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #eef1f0; font-size: 14px; }
    .cartRow .n { flex: 1; }
    .cartRow button { background: #eef1f0; width: 24px; height: 24px; border-radius: 4px; font-weight: 700; }
    #cartFooter { padding: 12px 14px; border-top: 2px solid #eef1f0; }
    #cartFooter .totals { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
    #cartFooter .grand { font-size: 18px; font-weight: 700; }
    #payBtn { width: 100%; padding: 13px; background: #1a7f5a; color: #fff; font-size: 17px; font-weight: 700; margin-top: 10px; }
    #payBtn:disabled { background: #9db8ae; }
    #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1c2321; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="statusbar">
    <span class="dot"></span><span id="connLabel">Online</span>
    <span id="queueBadge" class="hidden">0 queued</span>
    <span class="spacer"></span>
    <span id="userLabel"></span>
    <button id="syncBtn" class="hidden">Sync catalog</button>
    <button id="logoutBtn" class="hidden">Sign out</button>
  </div>

  <div id="login">
    <h1>FluentPOS Till</h1>
    <div id="loginError"></div>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
  </div>

  <div id="pos" class="hidden">
    <div id="products"></div>
    <div id="cartPanel">
      <h2>Basket</h2>
      <div id="cartItems"></div>
      <div id="cartFooter">
        <div class="totals"><span>Subtotal</span><span id="subTotal">£0.00</span></div>
        <div class="totals"><span>VAT</span><span id="vatTotal">£0.00</span></div>
        <div class="totals grand"><span>Total</span><span id="grandTotal">£0.00</span></div>
        <button id="payBtn" disabled>Pay cash</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
