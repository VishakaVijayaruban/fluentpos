name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: 🛒 Checkout repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: 🔁 Restore dependencies
      run: dotnet restore FluentPOS.sln
      working-directory: src/server

    - name: 🛠️ Build
      run: dotnet build FluentPOS.sln -c Release --no-restore
      working-directory: src/server

    - name: 🧪 Run unit tests
      run: dotnet test FluentPOS.sln -c Release --no-build
      working-directory: src/server
